<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recicla Pals</title>
<meta name="description" content="Fes una foto al teu residu i et dic on va. El reciclatge fàcil a Pals (Baix Empordà).">
<meta name="theme-color" content="#1D6BB0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recicla Pals">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="Recicla Pals">
<meta property="og:description" content="Fes una foto al teu residu i et dic on va.">
<meta property="og:image" content="icona-512.png">
<style>
  html, body { margin: 0; height: 100%; background: #1D6BB0; }
  body { overflow: hidden; }
  #app { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; display: block; background: #F6F1E6; }
  #carrega {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    padding: 24px; text-align: center; background: #1D6BB0; color: #fff;
    font: 700 20px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: opacity .3s;
  }
  #carrega img { width: 112px; height: 112px; border-radius: 26px; border: 3px solid #111; box-shadow: 4px 5px 0 #111; }
  #carrega p { margin: 0; max-width: 22em; font-weight: 400; font-size: 16px; }
  #carrega a { color: #FFD23F; font-weight: 700; }
  #carrega.amagat { opacity: 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { #carrega { transition: none; } }
</style>
</head>
<body>
<iframe id="app" title="Recicla Pals" allow="camera"
        src="https://script.google.com/macros/s/AKfycbx5eq6RntzoqXLiweDlzRok0SS9cPJAzIoU_OD1p3u0GBW0XnWUp9SU9xZflGwRPno/exec"></iframe>
<div id="carrega" role="status">
  <img src="icona-192.png" alt="">
  <span>Recicla Pals</span>
  <p id="ajuda" hidden>Està trigant més del normal. Comprova la connexió o <a href="https://script.google.com/macros/s/AKfycbx5eq6RntzoqXLiweDlzRok0SS9cPJAzIoU_OD1p3u0GBW0XnWUp9SU9xZflGwRPno/exec" target="_top">obre l’app directament</a>.</p>
</div>
<script>
  (function () {
    var carrega = document.getElementById('carrega');
    document.getElementById('app').addEventListener('load', function () {
      carrega.classList.add('amagat');
    });
    setTimeout(function () {
      if (!carrega.classList.contains('amagat')) document.getElementById('ajuda').hidden = false;
    }, 15000);
  })();
</script>
</body>
</html>
